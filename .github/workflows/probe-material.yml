name: Probe Material library

# Tek seferlik: Material kütüphanesinde hangi Expressive tema/bileşenler var, loga yazar.
# Actions > "Probe Material library" > Run workflow. İşin bitince bu dosyayı silebilirsin.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "com.google.android.material:material sürümü"
        default: "1.14.0"

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download AAR
        run: |
          V="${{ inputs.version }}"
          curl -fsSL -o m.aar "https://dl.google.com/dl/android/maven2/com/google/android/material/material/$V/material-$V.aar"
          mkdir x && cd x && unzip -q ../m.aar && unzip -q -o classes.jar -d cls
          ls -la ..

      - name: Report
        run: |
          cd x
          {
            echo "## Material ${{ inputs.version }}"
            echo
            echo "### Expressive temalar"
            grep -o 'name="Theme\.Material3Expressive[^"]*"' res/values/values.xml | sort -u | sed 's/name=//' || true
            echo
            echo "### Expressive widget stilleri (ilk 120)"
            grep -o 'name="Widget\.Material3Expressive[^"]*"' res/values/values.xml | sort -u | sed 's/name=//' | head -120 || true
            echo
            echo "### Expressive attr / diğer kaynaklar"
            grep -oE 'name="[A-Za-z0-9_.]*[Ee]xpressive[A-Za-z0-9_.]*"' res/values/values.xml | sort -u | grep -v 'Widget.Material3Expressive' | grep -v 'Theme.Material3Expressive' | head -80 || true
            echo
            echo "### Sınıflar"
            for p in loadingindicator button/ButtonGroup button/MaterialSplitButton floatingactionbutton/FloatingActionButtonMenu progressindicator/CircularProgressIndicator progressindicator/LinearProgressIndicator materialswitch navigationrail bottomappbar appbar/MaterialToolbar sidesheet; do
              echo "$p: $(find cls -path "*com/google/android/material/$p*" -name '*.class' | head -3 | tr '\n' ' ')"
            done
            echo
            echo "### Dinamik renk / MaterialColors sınıfları"
            find cls -path '*color/*' -name '*Dynamic*.class' | head
          } | tee "$GITHUB_STEP_SUMMARY"
