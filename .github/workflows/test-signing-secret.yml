name: Test Signing Secret

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret and decode keystore
        shell: bash
        env:
          MATERIAL_FILES_KEYSTORE: ${{ secrets.MATERIAL_FILES_KEYSTORE }}
          MATERIAL_FILES_KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_FILES_KEYSTORE_PASSWORD }}
        run: |
          echo "=== Secret checks ==="

          if [ -z "$MATERIAL_FILES_KEYSTORE" ]; then
            echo "ERROR: MATERIAL_FILES_KEYSTORE is empty"
            exit 1
          fi

          echo "Secret is present"
          echo "Secret length: ${#MATERIAL_FILES_KEYSTORE}"

          echo
          echo "=== Base64 validation ==="

          if printf '%s' "$MATERIAL_FILES_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/material-files.keystore"; then
            echo "Base64: VALID"
          else
            echo "Base64: INVALID"
            exit 1
          fi

          echo
          echo "=== Keystore checks ==="

          if [ ! -s "$RUNNER_TEMP/material-files.keystore" ]; then
            echo "ERROR: decoded keystore is empty"
            exit 1
          fi

          echo "Decoded keystore exists"
          echo "Decoded size: $(stat -c%s "$RUNNER_TEMP/material-files.keystore") bytes"

          echo
          echo "=== PKCS12/key checks ==="

          if keytool -list \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/material-files.keystore" \
            -storepass "$MATERIAL_FILES_KEYSTORE_PASSWORD" \
            -alias app >/dev/null 2>&1; then

            echo "PKCS12 keystore: VALID"
            echo "Alias 'app': FOUND"
          else
            echo "ERROR: Could not open PKCS12 keystore with alias 'app'"
            exit 1
          fi

          echo
          echo "ALL CHECKS PASSED"
