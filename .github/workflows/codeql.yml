name: CodeQL

# Sadece zamanlanmış çalışır: her gece 00:00 (Türkiye saati = 21:00 UTC), AMA yalnızca son 24 saatte
# depoya yeni commit girdiyse. Elle de başlatılabilir (workflow_dispatch → her zaman çalışır).
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Son 24 saatte commit var mı?
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='24 hours ago' --format=%H -1)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Son 24 saatte commit yok, tarama atlandı."
          fi

  analyze:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # CodeQL Kotlin/Java analizi için projenin gerçekten derlenmesi gerekiyor (derlenemeyen
      # kod analiz edilemez). Bu yüzden prebuild.yml/stable-release.yml'deki aynı SDK/NDK
      # kurulumunu burada da tekrarlıyoruz; imza secret'larına ihtiyaç yok, sadece derleniyor.
      - name: Install required SDK / NDK / CMake components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager | head -n1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # compileDebugSources derler ama paketleme/imzalama adımına hiç girmez — CodeQL'e zaten
      # sadece derlenmiş bytecode lazım. assembleDebug kullanmıyoruz çünkü debug build type artık
      # gerçek imza anahtarını istiyor (signing.gradle) ve bu workflow'da o secret'lar yok;
      # assembleDebug burada paketleme/imzalama aşamasında başarısız olurdu.
      - name: Build (compile only, no packaging/signing)
        run: ./gradlew compileDebugSources --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
