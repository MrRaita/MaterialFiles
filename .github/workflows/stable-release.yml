name: Stable Release

# SADECE elle tetiklenir (Actions sekmesi -> Stable Release -> Run workflow).
# Seçilen dalın son halini, prebuild.yml ile AYNI imza secret'larını kullanarak derler ve
# GitHub Releases'e KARARLI sürüm (pre-release değil) olarak yayınlar. Sürüm numarası
# app/build.gradle'dan okunur, artırılmaz — orada ne yazıyorsa o yayınlanır.
#
# ZORUNLU repo secret'ları (prebuild.yml ile aynı):
#   MATERIAL_FILES_KEYSTORE, MATERIAL_FILES_KEYSTORE_PASSWORD, MATERIAL_FILES_KEY_PASSWORD
# Keystore türü PKCS12, key alias'ı "app" — ikisi de aşağıda sabit geçiyor, secret olmalarına
# gerek yok (hassas olan sadece şifreler ve keystore'un kendisi).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # app/build.gradle şu an compileSdk=37, compileSdkMinor=2 kullanıyor; bu ikisi birlikte
      # gerçek paket adı "platforms;android-37.2" demek. build.gradle'da bu üç değerden biri
      # değişirse buradaki satırı da güncelle (prebuild.yml ile aynı tutulmalı).
      - name: Install required SDK / NDK / CMake components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager | head -n1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Read version from build.gradle
        id: version
        run: |
          echo "version_name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle | head -n1)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          MATERIAL_FILES_KEYSTORE: ${{ secrets.MATERIAL_FILES_KEYSTORE }}
        run: |
          if [ -z "$MATERIAL_FILES_KEYSTORE" ]; then
            echo "::error title=İmza secret'ı eksik::MATERIAL_FILES_KEYSTORE repo secret'ı tanımlı değil."
            exit 1
          fi
          echo "$MATERIAL_FILES_KEYSTORE" | base64 -d > "$RUNNER_TEMP/material-files.keystore"
          echo "STORE_FILE=$RUNNER_TEMP/material-files.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          STORE_TYPE: PKCS12
          STORE_PASSWORD: ${{ secrets.MATERIAL_FILES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: app
          KEY_PASSWORD: ${{ secrets.MATERIAL_FILES_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "release-artifacts/Kanrimate-${{ steps.version.outputs.version_name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: "Kanrimate Files ${{ steps.version.outputs.version_name }}"
          body: |
            Kararlı sürüm: ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
            Commit: ${{ github.sha }}
          prerelease: false
          files: release-artifacts/*.apk
