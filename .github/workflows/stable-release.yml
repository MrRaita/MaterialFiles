name: Stable Release

# SADECE elle tetiklenir (Actions sekmesi -> Stable Release -> Run workflow).
# Seçilen dalın son halini, prebuild.yml ile AYNI imza secret'larını kullanarak derler ve
# GitHub Releases'e KARARLI sürüm (pre-release değil) olarak yayınlar. Sürüm numarası
# app/build.gradle'dan okunur, artırılmaz — orada ne yazıyorsa o yayınlanır.
#
# ZORUNLU repo secret'ları (prebuild.yml ile aynı):
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # app/build.gradle şu an compileSdk=37, compileSdkMinor=2 kullanıyor; bu ikisi birlikte
      # gerçek paket adı "platforms;android-37.2" demek. build.gradle'da bu üç değerden biri
      # değişirse buradaki satırı da güncelle (prebuild.yml ile aynı tutulmalı).
      - name: Install required SDK / NDK / CMake components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager | head -n1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from build.gradle
        id: version
        run: |
          echo "version_name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle | head -n1)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error title=İmza secret'ı eksik::SIGNING_KEYSTORE_BASE64 repo secret'ı tanımlı değil."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "release-artifacts/MaterialFiles-${{ steps.version.outputs.version_name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: "MaterialFiles ${{ steps.version.outputs.version_name }}"
          body: |
            Kararlı sürüm: ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
            Commit: ${{ github.sha }}
          prerelease: false
          files: release-artifacts/*.apk
